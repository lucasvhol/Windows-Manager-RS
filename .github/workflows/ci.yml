name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: pwsh
        run: |
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          Select-String -Path test.log -Pattern "panicked at" -Context 0,3 | Select-Object -First 30 | ForEach-Object { "::error::" + $_.Line + " | " + ($_.Context.PostContext -join " ") }
          exit $code
