name: Release
# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a release with
# the installer and its checksum. The in-app Update button reads these releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($version -ne $tag) { throw "Tag v$tag doesn't match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: Build
        env:
          WM_RELEASE_REPO: ${{ github.repository }}
        run: cargo build --release -p win-manager

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VERSION" installer\win-manager-rs.iss
          $setup = "WinManagerRS-$env:VERSION-setup.exe"
          $hash = (Get-FileHash "dist\$setup" -Algorithm SHA256).Hash.ToLower()
          "$hash  $setup" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Win Manager RS ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/WinManagerRS-${{ env.VERSION }}-setup.exe
            dist/SHA256SUMS.txt
