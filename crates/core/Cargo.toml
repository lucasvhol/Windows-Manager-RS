[package]
name = "wm-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.105"
argon2 = "0.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = "0.37.0"
fluent-bundle = "0.16.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.2.2"
tracing = "0.1.44"
trash = "5.4.0"
unic-langid = "0.9.6"
ureq = "3.5.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
