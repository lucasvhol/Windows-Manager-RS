# Junk File Cleaner rules. Paths may use %ENV% variables and `*`/`?` in segments.
# A directory path means "its contents" (the folder itself is kept).
# `default` = selected on first scan; `min_age_hours` skips recently modified files.

[[rule]]
id = "user_temp"
title = "Temporary files (your account)"
group = "Windows"
description = "Files apps left in your temp folder. Files changed in the last 24 hours are kept."
paths = ['%TEMP%']
min_age_hours = 24
default = true

[[rule]]
id = "windows_temp"
title = "Temporary files (Windows)"
group = "Windows"
description = "Windows' own temp folder. Files changed in the last 24 hours are kept."
paths = ['%WINDIR%\Temp']
min_age_hours = 24
admin = true
default = true

[[rule]]
id = "wer_user"
title = "Error reports (your account)"
group = "Windows"
description = "Copies of crash reports that were already sent or are queued for Microsoft."
paths = ['%LOCALAPPDATA%\Microsoft\Windows\WER']
default = true

[[rule]]
id = "wer_system"
title = "Error reports (system)"
group = "Windows"
description = "System-wide crash report archive and queue."
paths = ['%PROGRAMDATA%\Microsoft\Windows\WER\ReportArchive', '%PROGRAMDATA%\Microsoft\Windows\WER\ReportQueue']
admin = true
default = true

[[rule]]
id = "crash_dumps"
title = "Application crash dumps"
group = "Windows"
description = "Memory dumps written when apps crash. Only needed to diagnose a specific crash."
paths = ['%LOCALAPPDATA%\CrashDumps']
default = true

[[rule]]
id = "memory_dumps"
title = "System memory dumps"
group = "Windows"
description = "Dumps from blue-screen crashes. Keep them if you are troubleshooting crashes."
paths = ['%WINDIR%\Minidump', '%WINDIR%\MEMORY.DMP']
admin = true

[[rule]]
id = "update_cache"
title = "Windows Update download cache"
group = "Windows"
description = "Already-installed update packages. Files from the last 7 days are kept so an in-progress update is not disturbed."
paths = ['%WINDIR%\SoftwareDistribution\Download']
min_age_hours = 168
admin = true

[[rule]]
id = "delivery_optimization"
title = "Delivery Optimization cache"
group = "Windows"
description = "Update pieces cached to share with other PCs."
paths = ['%WINDIR%\ServiceProfiles\NetworkService\AppData\Local\Microsoft\Windows\DeliveryOptimization\Cache']
admin = true

[[rule]]
id = "thumbnails"
title = "Thumbnail cache"
group = "Windows"
description = "Explorer rebuilds thumbnails as you browse; folders with many pictures will be slower once."
paths = ['%LOCALAPPDATA%\Microsoft\Windows\Explorer\thumbcache_*.db']

[[rule]]
id = "shader_cache"
title = "Graphics shader caches"
group = "Windows"
description = "DirectX, NVIDIA and AMD shader caches. Games may stutter briefly while shaders are rebuilt."
paths = ['%LOCALAPPDATA%\D3DSCache', '%LOCALAPPDATA%\NVIDIA\DXCache', '%LOCALAPPDATA%\NVIDIA\GLCache', '%LOCALAPPDATA%\AMD\DxCache', '%LOCALAPPDATA%\AMD\DxcCache']

[[rule]]
id = "chrome"
title = "Google Chrome cache"
group = "Browsers"
description = "Cached web content (not history, passwords or cookies). Close Chrome first for best results."
paths = ['%LOCALAPPDATA%\Google\Chrome\User Data\*\Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\*\Code Cache', '%LOCALAPPDATA%\Google\Chrome\User Data\*\GPUCache']
default = true

[[rule]]
id = "edge"
title = "Microsoft Edge cache"
group = "Browsers"
description = "Cached web content (not history, passwords or cookies). Close Edge first for best results."
paths = ['%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache', '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\GPUCache']
default = true

[[rule]]
id = "brave"
title = "Brave cache"
group = "Browsers"
description = "Cached web content (not history, passwords or cookies)."
paths = ['%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Cache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\Code Cache', '%LOCALAPPDATA%\BraveSoftware\Brave-Browser\User Data\*\GPUCache']
default = true

[[rule]]
id = "firefox"
title = "Firefox cache"
group = "Browsers"
description = "Cached web content (not history, passwords or cookies)."
paths = ['%LOCALAPPDATA%\Mozilla\Firefox\Profiles\*\cache2']
default = true

[[rule]]
id = "discord"
title = "Discord cache"
group = "Applications"
description = "Cached images and scripts. Close Discord first."
paths = ['%APPDATA%\discord\Cache', '%APPDATA%\discord\Code Cache', '%APPDATA%\discord\GPUCache']
default = true

[[rule]]
id = "steam_html"
title = "Steam web cache"
group = "Applications"
description = "Store and community page cache used by the Steam client."
paths = ['%LOCALAPPDATA%\Steam\htmlcache']

[[rule]]
id = "burn_temp"
title = "Disc burning staging files"
group = "Windows"
description = "Files Windows copied while preparing a CD or DVD that was never burned."
paths = ['%LOCALAPPDATA%\Microsoft\Windows\Burn\Burn']
default = true

[[rule]]
id = "etl_logs"
title = "Diagnostic trace logs (ETL)"
group = "Windows"
description = "Event trace logs Windows writes for troubleshooting. Logs from the last day are kept."
paths = ['%WINDIR%\Logs\WindowsUpdate\*.etl', '%PROGRAMDATA%\Microsoft\Diagnosis\ETLLogs\*\*.etl', '%WINDIR%\Panther\*.etl']
min_age_hours = 24
admin = true

[[rule]]
id = "cbs_logs"
title = "Old servicing logs"
group = "Windows"
description = "Compressed copies of old component servicing (CBS) and DISM logs."
paths = ['%WINDIR%\Logs\CBS\CbsPersist_*.cab', '%WINDIR%\Logs\CBS\CbsPersist_*.log', '%WINDIR%\Logs\DISM\*.log']
min_age_hours = 168
admin = true

[[rule]]
id = "update_logs"
title = "Windows Update backup logs"
group = "Windows"
description = "Old Windows Update database logs and setup leftovers kept after updates were installed."
paths = ['%WINDIR%\SoftwareDistribution\DataStore\Logs\*.jrs', '%WINDIR%\SoftwareDistribution\PostRebootEventCache.V2', '%WINDIR%\SoftwareDistribution\SLS']
min_age_hours = 168
admin = true

[[rule]]
id = "broken_shortcuts"
title = "Broken shortcuts (your account)"
group = "Leftovers"
description = "Shortcuts on your desktop, in your Start Menu and Quick Launch whose program or file no longer exists on this PC's disks. Shortcuts to network or removable drives are kept."
kind = "broken-shortcuts"
default = true

[[rule]]
id = "invalid_start_menu"
title = "Invalid Start Menu items"
group = "Leftovers"
description = "Empty Start Menu folders, and broken shortcuts in the Start Menu and on the desktop shared by all users."
kind = "invalid-start-menu"
admin = true

[[rule]]
id = "empty_program_files"
title = "Empty Program Files folders"
group = "Leftovers"
description = "Folders in Program Files that contain nothing at all, usually left behind by uninstallers."
kind = "empty-program-files"
admin = true

[[rule]]
id = "installer_orphans"
title = "Orphaned installer packages"
group = "Leftovers"
description = 'Installer (.msi) and patch (.msp) files cached in Windows\Installer that no installed program uses any more. Skipped entirely if Windows Installer cannot list its packages.'
kind = "installer-orphans"
admin = true

[[rule]]
id = "empty_folders"
title = "Empty folders"
group = "On the selected drives"
description = "Folders with nothing in them, in your own files on the drives chosen above. Windows, program and app-data folders, a drive's top-level folders and your profile's main folders are never included. Review the list before cleaning."
kind = "empty-folders"

[[rule]]
id = "zero_byte"
title = "Zero-byte files"
group = "On the selected drives"
description = "Files with no content, in your own files on the drives chosen above. Marker files programs rely on (such as __init__.py, .gitkeep and lock files) are kept. Review the list before cleaning."
kind = "zero-byte-files"

[[rule]]
id = "recycle_bin"
title = "Empty the Recycle Bin"
group = "Recycle Bin"
description = "Permanently deletes everything in the Recycle Bin on all drives."
kind = "recycle-bin"
