[package]
name = "wm-tools-custom"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
egui_extras = "0.37.0"
chrono = "0.4.45"
anyhow = "1.0.105"
rfd = "0.18.0"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
tracing = "0.1.44"
walkdir = "2.5.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage"] }
wm-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"
