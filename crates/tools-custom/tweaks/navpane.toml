# Navigation Pane. Per-user overrides of the documented
# System.IsPinnedToNameSpaceTree property (HKCU\Software\Classes\CLSID\…).

[[tweak]]
id = "nav_expand_current"
title = "Expand to the open folder"
description = "The navigation pane follows the folder you are viewing."
group = "Behaviour"
[[tweak.set]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "NavPaneExpandToCurrentFolder"
on = { dword = 1 }
off = { dword = 0 }

[[tweak]]
id = "nav_show_all"
title = "Show all folders"
description = "Shows Desktop contents, Control Panel and Recycle Bin in the navigation pane."
group = "Behaviour"
[[tweak.set]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
name = "NavPaneShowAllFolders"
on = { dword = 1 }
off = { dword = 0 }
