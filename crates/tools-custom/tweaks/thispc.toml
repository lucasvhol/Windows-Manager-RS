# This PC folders. Uses the documented ThisPCPolicy property of each known folder.
# Desktop has no ThisPCPolicy by default, so its "off" deletes the value.

[[tweak]]
id = "thispc_desktop"
title = "Hide Desktop in This PC"
description = "Removes the Desktop folder from This PC (it stays in the navigation pane)."
group = "Folders shown in This PC"
effect = "explorer"
[[tweak.set]]
key = 'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\FolderDescriptions\{B4BFCC3A-DB2C-424C-B029-7FE99A87C641}\PropertyBag'
name = "ThisPCPolicy"
on = { sz = "Hide" }
off = "delete"

