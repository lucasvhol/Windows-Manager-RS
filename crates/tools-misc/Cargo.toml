license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.105"
blake3 = "1.8.7"
rayon = "1.12.0"
chrono = "0.4.45"
egui_extras = "0.37.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
