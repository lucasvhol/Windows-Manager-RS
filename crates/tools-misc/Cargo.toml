tracing = "0.1.44"
walkdir = "2.5.1"
winreg = "0.56.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
wm-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"
