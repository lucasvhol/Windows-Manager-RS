[package]
name = "wm-tools-network"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
egui_extras = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.4"
toml = "1.2.2"
tracing = "0.1.44"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Dns"] }
wm-core = { version = "0.1.0", path = "../core" }

[dev-dependencies]
tempfile = "3.27.0"
