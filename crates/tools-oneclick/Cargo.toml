[package]
name = "wm-tools-oneclick"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = "0.4.45"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
wm-core = { version = "0.1.0", path = "../core" }
wm-tools-cleaner = { version = "0.1.0", path = "../tools-cleaner" }
wm-tools-custom = { version = "0.1.0", path = "../tools-custom" }
wm-tools-optimizer = { version = "0.1.0", path = "../tools-optimizer" }
wm-tools-security = { version = "0.1.0", path = "../tools-security" }
wm-tools-network = { version = "0.1.0", path = "../tools-network" }
sysinfo = "0.40.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_System_Com", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
