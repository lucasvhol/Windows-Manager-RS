[package]
name = "wm-tools-security"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.105"
argon2 = "0.6.0"
chrono = "0.4.45"
egui_extras = "0.37.0"
getrandom = "0.4.3"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
walkdir = "2.5.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Restore"] }
wm-core = { version = "0.1.0", path = "../core" }
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"
