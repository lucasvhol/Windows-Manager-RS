[[tweak]]
id = "wu_no_auto_update"
title = "Turn off automatic Windows Update"
description = "Windows no longer downloads or installs updates by itself; you check for them manually."
group = "Windows Update"
warning = "Security fixes will not be installed until you check for updates yourself."
[[tweak.set]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
name = "NoAutoUpdate"
on = { dword = 1 }
off = "delete"

[[tweak]]
id = "wu_mode"
title = "How updates are installed"
description = "Whether Windows Update downloads and installs updates automatically or asks first."
group = "Windows Update"
kind = "choice"
target = { key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU', name = "AUOptions" }
[[tweak.option]]
label = "Windows default"
value = "delete"
[[tweak.option]]
label = "Notify before downloading"
value = { dword = 2 }
[[tweak.option]]
label = "Download automatically, ask before installing"
value = { dword = 3 }
[[tweak.option]]
label = "Download and install automatically"
value = { dword = 4 }

[[tweak]]
id = "wu_no_auto_restart"
title = "Never restart automatically while someone is signed in"
description = "Windows waits for you to restart after installing updates."
group = "Windows Update"
[[tweak.set]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU'
name = "NoAutoRebootWithLoggedOnUsers"
on = { dword = 1 }
off = "delete"

[[tweak]]
id = "wu_no_drivers"
title = "Don't install drivers through Windows Update"
description = "Keeps the drivers you installed yourself, e.g. from your graphics card maker."
group = "Windows Update"
[[tweak.set]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
name = "ExcludeWUDriversInQualityUpdate"
on = { dword = 1 }
off = "delete"

[[tweak]]
id = "store_no_auto_update"
title = "Don't update Store apps automatically"
description = "Microsoft Store apps are only updated when you open the Store's library."
group = "Windows Update"
[[tweak.set]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\WindowsStore'
name = "AutoDownload"
on = { dword = 2 }
off = "delete"

[[tweak]]
id = "onedrive_off"
title = "Turn off OneDrive"
description = "OneDrive stops syncing and can't be started for any user. Files already on this PC stay where they are."
group = "OneDrive"
effect = "sign-out"
[[tweak.set]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows\OneDrive'
name = "DisableFileSyncNGSC"
on = { dword = 1 }
off = "delete"

[[tweak]]
id = "onedrive_uninstall"
title = "Uninstall OneDrive"
description = "Removes the OneDrive app for this account with Microsoft's own uninstaller. Your files stay in the OneDrive folder."
group = "OneDrive"
kind = "action"
action = { program = "winget", args = ["uninstall", "--id", "Microsoft.OneDrive", "--silent", "--accept-source-agreements"], confirm = "Uninstall OneDrive for this account? You can reinstall it from Microsoft." }

[[tweak]]
id = "regback"
title = "Back up the registry automatically"
description = "Windows again keeps a copy of the registry hives in System32\\config\\RegBack, refreshed during maintenance."
group = "Registry and shutdown"
effect = "restart"
[[tweak.set]]
key = 'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Configuration Manager'
name = "EnablePeriodicBackup"
on = { dword = 1 }
off = "delete"

[[tweak]]
id = "shutdown_tracker"
title = "Ask why the PC is shut down"
description = "Shows the Shutdown Event Tracker, which records a reason for each shutdown or restart in the event log."
group = "Registry and shutdown"
[[tweak.set]]
key = 'HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Reliability'
name = "ShutdownReasonOn"
on = { dword = 1 }
off = "delete"
