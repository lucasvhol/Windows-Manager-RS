# Other Security: app permissions, Windows Update, OneDrive, registry backup and
# shutdown tracking. `off` is the Windows 11 default ("delete" = value absent).

[[tweak]]
id = "deny_camera"
title = "Block apps from using the camera"
description = "Apps can no longer use the camera for this account."
group = "App permissions"
[[tweak.set]]
key = 'HKCU\Software\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\webcam'
name = "Value"
on = { sz = "Deny" }
off = { sz = "Allow" }

